# Bilibili PCDN block rules for Nikki / Mihomo
# 来源：综合已查到的 B 站 PCDN / MCDN / P2P CDN 相关公开规则与讨论。
# 用途：用于 OpenWrt Nikki / Mihomo / OpenClash 的 rule-provider。
# 建议动作：REJECT 或 REJECT-DROP。
# 原则：尽量包含已收集到的 B 站 PCDN 规则；不屏蔽正常主站与普通视频 CDN，避免大面积误伤。

payload:
  # B 站 MCDN / PCDN 视频节点
  - DOMAIN-SUFFIX,mcdn.bilivideo.cn
  - DOMAIN-SUFFIX,mcdn.bilivideo.com
  - DOMAIN-SUFFIX,szbdyd.com
  - DOMAIN,v1d.szbdyd.com

  # B 站 PCDN tracker / 控制域名
  - DOMAIN,pcdn.biliapi.net
  - DOMAIN,ks-sh-tracker-02.biliapi.net
  - DOMAIN-REGEX,^.*-pcdn-.*\.biliapi\.net$
  - DOMAIN-REGEX,^.*pcdn.*\.biliapi\.net$

  # B 站 P2P / STUN 相关
  # 若直播互动/聊天室异常，可优先检查这两条。
  - DOMAIN-REGEX,^stun.*\.chat\.bilibili\.com$
  - DOMAIN-REGEX,^.*-p2p-.*\.chat\.bilibili\.com$

  # 社区 B 站 PCDN 规则中出现的 tracker IP
  - IP-CIDR,81.69.192.254/32,no-resolve
  - IP-CIDR,159.75.113.64/32,no-resolve
  - IP-CIDR,82.156.104.30/32,no-resolve
  - IP-CIDR,139.155.176.138/32,no-resolve
  - IP-CIDR,42.192.67.56/32,no-resolve
  - IP-CIDR,159.75.138.193/32,no-resolve
  - IP-CIDR,82.156.104.41/32,no-resolve
  - IP-CIDR,139.155.7.96/32,no-resolve
  - IP-CIDR6,2402:4e00:1401:cd03:0:9824:892b:3332/128,no-resolve
  - IP-CIDR6,2402:4e00:1401:cd03:0:9824:888e:36c2/128,no-resolve
